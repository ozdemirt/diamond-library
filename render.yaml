services:
  - type: web
    name: diamond-library
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python index_search.py
    startCommand: python server.py
    healthCheckPath: /api/stats
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DB_PATH
        value: search_index.db
      - key: TXT_DIR
        value: converted_texts
